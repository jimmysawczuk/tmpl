name: Release new version
on:
  release:
    types: [created]
jobs:
  build:
    runs-on: ${{ matrix.arch.os }}
    strategy:
      matrix:
        arch:
          - os: macos-latest
            arch: darwin-amd64
          - os: ubuntu-latest
            arch: linux-amd64
          - os: ubuntu-latest
            arch: linux-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: "0"
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "^1.27"
      - name: Build
        run: |
          echo "-X main.version=${{ github.ref_name }} -X main.revision=$GITHUB_SHA -X main.date=$(date --iso-8601=seconds)" > /tmp/buildtags
          cat /tmp/buildtags

          CGO_ENABLED=0 go build -a -o "tmpl-${{ github.ref_name }}-${{ matrix.arch.arch }}" -ldflags "-s -w $(cat /tmp/buildtags)" -mod=vendor .
      - name: Upload build
        uses: softprops/action-gh-release@v3
        with:
          files: ./tmpl-${{ github.ref_name }}-${{ matrix.arch.arch }}
